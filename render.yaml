services:
  - type: web
    name: starnet-free-api-router
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PROVIDER_ORDER
        value: groq,gemini,mistral,openrouter
      - key: ROUTER_API_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: MISTRAL_MODEL
        value: mistral-small-latest
      - key: OPENROUTER_MODEL
        value: meta-llama/llama-3.3-70b-instruct:free
